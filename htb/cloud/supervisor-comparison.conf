[program:wildcast-comparison]
directory=/workspace/wildcast
command=/venv/main/bin/python -u scripts/cloud_worker.py --gpu 0 --plan cloud/moveformer-comparators.json --max-hours 1
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
