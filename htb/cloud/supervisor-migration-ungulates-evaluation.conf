[program:wildcast-migration-ungulates-evaluation]
directory=/workspace/wildcast
command=/venv/main/bin/python -u -m wildcast.cli --data data/migration-expanded-dev-v2 migration-evaluate --checkpoints runs/migration-ungulates-goal_route-seed17/best.pt runs/migration-ungulates-history_direct-seed17/best.pt --output runs/migration-ungulates-comparison --samples 64 --bootstrap-replicates 300 --device cuda
environment=CUDA_VISIBLE_DEVICES="0",OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
autostart=false
autorestart=false
stdout_logfile=/workspace/wildcast/cloud/migration-ungulates-evaluation.log
stdout_logfile_maxbytes=1048576
redirect_stderr=true
stopasgroup=true
killasgroup=true
