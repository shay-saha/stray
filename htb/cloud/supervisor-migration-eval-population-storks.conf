[program:wildcast-migration-eval-population-storks]
directory=/workspace/wildcast
command=/venv/main/bin/python -u -m wildcast.cli --data data/migration-population-storks-v3 migration-evaluate --checkpoints runs/migration-transfer-storks-goal_route-seed17/best.pt runs/migration-transfer-storks-history_direct-seed17/best.pt --output runs/migration-population-storks-comparison --samples 64 --seed 2026 --batch-size 64 --bootstrap-replicates 500 --device cuda
environment=CUDA_VISIBLE_DEVICES="1",OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
autostart=false
autorestart=false
stdout_logfile=/workspace/wildcast/cloud/migration-eval-population-storks.log
stdout_logfile_maxbytes=1048576
redirect_stderr=true
stopasgroup=true
killasgroup=true
