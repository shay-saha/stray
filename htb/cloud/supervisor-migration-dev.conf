[program:wildcast-migration0]
directory=/workspace/wildcast
command=/venv/main/bin/python -u scripts/cloud_worker.py --plan cloud/migration-dev-gpu0.json --gpu 0 --max-hours 2
autostart=false
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true

[program:wildcast-migration1]
directory=/workspace/wildcast
command=/venv/main/bin/python -u scripts/cloud_worker.py --plan cloud/migration-dev-gpu1.json --gpu 1 --max-hours 2
autostart=false
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true

[program:wildcast-migration-baselines]
directory=/workspace/wildcast
command=/venv/main/bin/python -u -m wildcast.cli --data data/migration-dev-v1 migration-evaluate --output runs/migration-dev-baselines --samples 64 --bootstrap-replicates 300
environment=OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
autostart=false
autorestart=false
stdout_logfile=/workspace/wildcast/cloud/migration-baselines.log
stdout_logfile_maxbytes=1048576
redirect_stderr=true
stopasgroup=true
killasgroup=true
