[program:wildcast-migration-calibration0]
directory=/workspace/wildcast
command=/venv/main/bin/python -u scripts/cloud_worker.py --plan cloud/migration-calibration-gpu0.json --gpu 0 --max-hours 4
autostart=false
autorestart=false
stdout_logfile=/workspace/wildcast/cloud/migration-calibration0.log
stdout_logfile_maxbytes=1048576
redirect_stderr=true
stopasgroup=true
killasgroup=true

[program:wildcast-migration-calibration1]
directory=/workspace/wildcast
command=/venv/main/bin/python -u scripts/cloud_worker.py --plan cloud/migration-calibration-gpu1.json --gpu 1 --max-hours 4
autostart=false
autorestart=false
stdout_logfile=/workspace/wildcast/cloud/migration-calibration1.log
stdout_logfile_maxbytes=1048576
redirect_stderr=true
stopasgroup=true
killasgroup=true

