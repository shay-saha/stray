[program:wildcast-migration-timing]
directory=/workspace/wildcast
command=/venv/main/bin/python -u -m wildcast.migration_timing --data data/migration-expanded-dev-v3 --output runs/migration-timing-fixed --alpha 10 --samples 512 --seed 1701 --bootstrap 1000
environment=OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
autostart=false
autorestart=false
stdout_logfile=/workspace/wildcast/cloud/migration-timing.log
stdout_logfile_maxbytes=1048576
redirect_stderr=true
stopasgroup=true
killasgroup=true
