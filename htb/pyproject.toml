[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildcast"
version = "0.1.0"
description = "Auditable probabilistic wildlife movement forecasting"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "requests>=2.31", "scipy>=1.12", "torch>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
environment = ["rasterio>=1.4"]
ecology = ["rasterio>=1.4", "shapely>=2", "pyproj>=3.6", "pyshp>=2.3", "openpyxl>=3.1", "biopython>=1.84", "netCDF4>=1.7", "tifffile>=2025.5.10"]
moveformer = ["einops==0.8.1", "entmax==1.3"]

[project.scripts]
wildcast = "wildcast.cli:main"

[tool.setuptools.packages.find]
include = ["wildcast*"]

[tool.pytest.ini_options]
pythonpath = ["."]
