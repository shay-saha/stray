[program:wildcast-migration-core-evaluation]
directory=/workspace/wildcast
command=/venv/main/bin/python -u -m wildcast.cli --data data/migration-expanded-dev-v3 migration-evaluate --checkpoints runs/migration-v3-seasonal_static-seed17/best.pt runs/migration-v3-seasonal_static-seed42/best.pt runs/migration-v3-seasonal_static-seed73/best.pt runs/migration-v3-history_direct-seed17/best.pt runs/migration-v3-history_direct-seed42/best.pt runs/migration-v3-history_direct-seed73/best.pt runs/migration-v3-goal_route-seed17/best.pt runs/migration-v3-goal_route-seed42/best.pt runs/migration-v3-goal_route-seed73/best.pt runs/migration-v3-goal_route-large-seed17/best.pt --output runs/migration-v3-core-comparison --samples 64 --bootstrap-replicates 500 --device cuda
environment=CUDA_VISIBLE_DEVICES="0",OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
autostart=false
autorestart=false
stdout_logfile=/workspace/wildcast/cloud/migration-core-evaluation.log
stdout_logfile_maxbytes=1048576
redirect_stderr=true
stopasgroup=true
killasgroup=true
