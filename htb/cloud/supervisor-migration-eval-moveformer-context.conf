[program:wildcast-migration-eval-moveformer-context]
command=/venv/main/bin/python -u -m wildcast.cli --data data/migration-expanded-dev-v3 migration-evaluate --baselines --checkpoints runs/migration-v3-moveformer-context-actual-seed17/best.pt runs/migration-v3-moveformer-context-actual-seed42/best.pt runs/migration-v3-moveformer-context-actual-seed73/best.pt runs/migration-v3-moveformer-context-masked-seed17/best.pt runs/migration-v3-moveformer-context-masked-seed42/best.pt runs/migration-v3-moveformer-context-masked-seed73/best.pt --output runs/migration-v3-moveformer-context-comparison --samples 64 --seed 2026 --batch-size 64 --bootstrap-replicates 500 --device cuda
directory=/workspace/wildcast
environment=CUDA_VISIBLE_DEVICES="1",OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
autostart=false
autorestart=false
stdout_logfile=/workspace/wildcast/cloud/migration-eval-moveformer-context.log
stdout_logfile_maxbytes=1048576
redirect_stderr=true
stopasgroup=true
killasgroup=true
