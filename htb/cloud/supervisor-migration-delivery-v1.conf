[program:wildcast-migration-delivery-v1]
directory=/workspace/wildcast
command=/venv/main/bin/python -u scripts/migration_delivery.py --plan cloud/migration-delivery-v1.json
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
