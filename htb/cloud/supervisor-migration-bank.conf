[program:wildcast-migration-bank]
directory=/workspace/wildcast
command=/venv/main/bin/python -u -m wildcast.migration_retrieval_train prepare --data data/migration-expanded-dev-v3 --output data/migration-bank-v3 --candidates 64 --seed 1701
environment=OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
autostart=false
autorestart=false
stdout_logfile=/workspace/wildcast/cloud/migration-bank.log
stdout_logfile_maxbytes=1048576
redirect_stderr=true
stopasgroup=true
killasgroup=true
