[program:wildcast-gpu0]
directory=/workspace/wildcast
command=/venv/main/bin/python -u scripts/cloud_worker.py --gpu 0 --plan cloud/router-gpu0.json --max-hours 4
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:wildcast-gpu1]
directory=/workspace/wildcast
command=/venv/main/bin/python -u scripts/cloud_worker.py --gpu 1 --plan cloud/adapters-gpu1.json --max-hours 4
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
