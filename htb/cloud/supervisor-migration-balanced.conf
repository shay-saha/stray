[program:wildcast-migration-balanced0]
directory=/workspace/wildcast
command=/venv/main/bin/python -u scripts/cloud_worker.py --plan cloud/migration-balanced-gpu0.json --gpu 0 --max-hours 4
autostart=false
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true

[program:wildcast-migration-balanced1]
directory=/workspace/wildcast
command=/venv/main/bin/python -u scripts/cloud_worker.py --plan cloud/migration-balanced-gpu1.json --gpu 1 --max-hours 4
autostart=false
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true

