[program:wildcast-migration-eval-regimes]
directory=/workspace/wildcast
command=/venv/main/bin/python -u -m wildcast.cli --data data/migration-expanded-dev-v3 migration-evaluate --baselines --checkpoints runs/migration-v3-regime-identity/best.pt runs/migration-v3-regime-seasonal/best.pt runs/migration-v3-regime-active-species_sqrt-seed17/best.pt runs/migration-v3-regime-active-species_sqrt-seed42/best.pt runs/migration-v3-regime-active-species_sqrt-seed73/best.pt runs/migration-v3-regime-active-animal-seed17/best.pt runs/migration-v3-regime-active-animal-seed42/best.pt runs/migration-v3-regime-active-animal-seed73/best.pt --output runs/migration-v3-regimes-comparison --samples 64 --seed 2026 --batch-size 64 --bootstrap-replicates 500 --device cuda
environment=CUDA_VISIBLE_DEVICES="0",OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
autostart=false
autorestart=false
stdout_logfile=/workspace/wildcast/cloud/migration-eval-regimes.log
stdout_logfile_maxbytes=1048576
redirect_stderr=true
stopasgroup=true
killasgroup=true
