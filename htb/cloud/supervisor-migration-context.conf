[program:wildcast-migration-context]
directory=/workspace/wildcast
command=/venv/main/bin/python -u -m wildcast.migration_route_context --data data/migration-expanded-dev-v3 --bank data/migration-bank-v3 --fields data/migration-destination-fields-v2 --output data/migration-route-context-v3
environment=OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
autostart=false
autorestart=false
stdout_logfile=/workspace/wildcast/cloud/migration-context.log
stdout_logfile_maxbytes=1048576
redirect_stderr=true
stopasgroup=true
killasgroup=true
