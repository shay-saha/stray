[program:wildcast-migration-ensemble-core-balanced]
directory=/workspace/wildcast
command=/venv/main/bin/python -u -m wildcast.migration_ensemble --data data/migration-expanded-dev-v3 --checkpoints runs/migration-v3-goal_route-seed17/best.pt runs/migration-v3-goal_route-seed42/best.pt runs/migration-v3-goal_route-seed73/best.pt runs/migration-v3-balanced-species_sqrt-seed17/best.pt runs/migration-v3-balanced-species_sqrt-seed42/best.pt runs/migration-v3-balanced-species_sqrt-seed73/best.pt --output runs/migration-v3-ensemble-core-balanced --samples 64 --folds 3 --seed 1701 --batch-size 32 --steps 500 --bootstrap-replicates 500 --device cuda
environment=CUDA_VISIBLE_DEVICES="0",OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
autostart=false
autorestart=false
stdout_logfile=/workspace/wildcast/cloud/migration-ensemble-core-balanced.log
stdout_logfile_maxbytes=1048576
redirect_stderr=true
stopasgroup=true
killasgroup=true
