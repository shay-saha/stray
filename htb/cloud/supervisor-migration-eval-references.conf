[program:wildcast-migration-eval-references]
command=/venv/main/bin/python -u -m wildcast.cli --data data/migration-expanded-dev-v3 migration-evaluate --baselines --checkpoints runs/migration-v3-moveformer-seed17/best.pt runs/migration-v3-moveformer-seed42/best.pt runs/migration-v3-moveformer-seed73/best.pt runs/migration-v3-moveformer-endpoint-seed17/best.pt runs/migration-v3-moveformer-endpoint-seed42/best.pt runs/migration-v3-moveformer-endpoint-seed73/best.pt --output runs/migration-v3-references-comparison --samples 64 --seed 2026 --batch-size 64 --bootstrap-replicates 500 --device cuda
directory=/workspace/wildcast
environment=CUDA_VISIBLE_DEVICES="0",OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
autostart=false
autorestart=false
stdout_logfile=/workspace/wildcast/cloud/migration-eval-references.log
stdout_logfile_maxbytes=1048576
redirect_stderr=true
stopasgroup=true
killasgroup=true
